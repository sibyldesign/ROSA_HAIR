<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rosa Hair - 預約系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary: #BCA38F;
      --primary-dark: #A08875;
      --bg: #FDFBF7;
      --text-dark: #5C4B3C;
      --border-light: #EBE5DF;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0; padding: 0;
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      width: 100%;
      position: relative;
    }
    .floral-deco {
      position: fixed;
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }
    .floral-top { top: -30px; right: -30px; width: 250px; height: 250px; }
    .floral-bottom { bottom: -30px; left: -30px; width: 200px; height: 200px; transform: rotate(180deg); }
    .header {
      text-align: center; padding: 35px 20px 25px;
      background: rgba(253, 251, 247, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      position: relative; z-index: 2;
    }
    #promo {
      background: var(--primary); color: #fff; padding: 12px;
      text-align: center; font-size: 14px; font-weight: bold; letter-spacing: 1px;
    }
    .side-nav {
      position: fixed; left: 12px; bottom: 20px;
      display: flex; flex-direction: column; gap: 12px; z-index: 100;
    }
    .side-btn {
      width: 42px; height: 42px; background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s;
    }
    .side-btn img { width: 22px; height: 22px; opacity: 0.6; transition: 0.3s; }
    .side-btn:hover { background: var(--primary); }
    .side-btn:hover img { opacity: 1; filter: brightness(200%); }
    .container-app { max-width: 500px; margin: 20px auto; padding: 0 15px; position: relative; z-index: 2; }
    .custom-card {
      background: rgba(255,255,255,0.95); border-radius: 16px; padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.04); margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.8);
    }
    label { font-weight: bold; margin-bottom: 8px; font-size: 14px; color: var(--text-dark); }
    .form-control, .form-select {
      border: 1px solid var(--border-light); border-radius: 10px; padding: 12px; font-size: 15px; background: #fafafa;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 0.25rem rgba(188, 163, 143, 0.25); background: #fff;
    }
    .type-btn {
      flex: 1; padding: 12px; border: 1px solid var(--border-light); border-radius: 10px;
      text-align: center; cursor: pointer; font-size: 14px; background: #fafafa; font-weight: bold; transition: 0.3s; color: #777;
    }
    .type-btn.active {
      background: var(--primary); color: white; border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(188, 163, 143, 0.3);
    }
    .hint-box {
      margin-top: 10px; padding: 12px; background: #FDF8F5; border-radius: 10px;
      font-size: 13px; display: none; line-height: 1.5; color: var(--text-dark); border-left: 4px solid var(--primary);
    }
    .chk-label {
      display: flex; align-items: center; padding: 12px 10px; border: 1px solid var(--border-light);
      border-radius: 10px; cursor: pointer; font-size: 14px; background: #fafafa; transition: 0.2s;
    }
    .chk-label:hover { background: #f0f0f0; }
    .chk-label input { margin-right: 8px; accent-color: var(--primary); transform: scale(1.2); }
    .chk-label.selected { background: #FDF8F5; border-color: var(--primary); font-weight: bold; color: var(--text-dark); }
    .cal-wrapper { border: 1px solid var(--border-light); border-radius: 12px; overflow: hidden; background: #fff; margin-bottom: 10px; }
    .cal-header-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; background: #fafafa; border-bottom: 1px solid var(--border-light); font-weight: bold;
    }
    .cal-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--primary-dark); padding: 5px 15px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-light); }
    .cal-cell { background: #fff; text-align: center; padding: 12px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .cal-cell.header { background: #fafafa; font-size: 12px; color: #888; font-weight: bold; padding: 8px 0; cursor: default; }
    .cal-cell.disabled { color: #ccc; cursor: not-allowed; background: #fdfdfd; }
    .cal-cell.available { font-weight: bold; color: var(--text-dark); }
    .cal-cell.available:hover { background: #FDF8F5; }
    .cal-cell.active { background: var(--primary) !important; color: #fff !important; font-weight: bold; }
    .cal-cell.empty { background: #fafafa; cursor: default; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--text-dark); color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    .btn-submit:hover { background: #4a3c30; transform: translateY(-2px); }
    .btn-submit:disabled { background: #999; transform: none; }
    .btn-check {
      width: 100%; padding: 16px; background: transparent; color: var(--text-dark);
      border: 2px solid var(--text-dark); border-radius: 12px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: 0.3s; margin-top: 12px;
    }
    .btn-check:hover { background: var(--text-dark); color: #fff; }
    .care-section {
      background: rgba(255,255,255,0.9); border-radius: 16px; margin-bottom: 20px;
      overflow: hidden; border: 1px solid var(--border-light);
    }
    .care-header { padding: 18px; background: #fff; cursor: pointer; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }
    .care-content { padding: 18px; font-size: 14px; line-height: 1.7; display: none; white-space: pre-wrap; color: #666; border-top: 1px solid var(--border-light); }
    .portfolio-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 22px; margin: 40px 0 20px; letter-spacing: 3px; }
    .tab-wrap { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding-bottom: 20px; }
    .tab {
      padding: 8px 18px; font-size: 13px; border: 1px solid var(--border-light); border-radius: 25px;
      cursor: pointer; background: #fff; color: #666; font-weight: bold;
    }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .work-item {
      background: #fff; border-radius: 16px; border: 1px solid var(--border-light);
      overflow: hidden; cursor: pointer; transition: 0.3s;
    }
    .work-item:hover { transform: translateY(-3px); }
    .work-img { width: 100%; aspect-ratio: 3/4; background-size: cover; background-position: center; }
    .work-info { padding: 12px; font-size: 14px; font-weight: bold; text-align: center; }
    #success-screen { display: none; text-align: center; padding: 80px 20px; background: var(--bg); height: 100vh; }
    .success-icon { font-size: 70px; color: var(--primary); margin-bottom: 20px; }
    .footer { text-align: center; padding: 50px 20px 80px; font-size: 12px; color: #999; }
    .footer a { color: var(--primary-dark); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<svg class="floral-deco floral-top" viewBox="0 0 200 200">
  <g stroke="var(--primary-dark)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20,180 Q80,120 180,20" />
    <path d="M60,140 Q40,90 90,90 Q100,120 60,140" />
    <path d="M110,90 Q90,40 140,40 Q150,70 110,90" />
    <path d="M80,120 Q130,140 140,100 Q110,80 80,120" />
    <path d="M130,70 Q180,90 190,50 Q160,30 130,70" />
  </g>
</svg>
<svg class="floral-deco floral-bottom" viewBox="0 0 200 200">
  <g stroke="var(--primary-dark)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20,180 Q80,120 180,20" />
    <path d="M60,140 Q40,90 90,90 Q100,120 60,140" />
    <path d="M110,90 Q90,40 140,40 Q150,70 110,90" />
    <path d="M80,120 Q130,140 140,100 Q110,80 80,120" />
    <path d="M130,70 Q180,90 190,50 Q160,30 130,70" />
  </g>
</svg>

<div id="booking-ui">
  <div class="header">
    <h1 style="font-family: 'Playfair Display', serif; color: var(--text-dark); margin:0; font-size: 28px; letter-spacing: 2px;">Rosa Hair</h1>
    <div style="font-size: 13px; color: var(--primary-dark); letter-spacing: 5px; margin-top: 6px; font-weight: bold;">蘿莎髮妝</div>
  </div>
  <div id="promo">正在載入最新公告...</div>

  <div class="side-nav">
    <a id="nav-ig" href="#" class="side-btn" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="IG"></a>
    <a id="nav-line" href="#" class="side-btn" target="_blank"><img src="https://i.postimg.cc/0jWm144X/S-13680953.jpg" alt="LINE"></a>
    <a id="nav-map" href="#" class="side-btn" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/854/854878.png" alt="Map"></a>
  </div>

  <div class="container-app">
    <div class="custom-card">
      <form id="bookForm">
        <div class="mb-4">
          <label class="form-label">電話</label>
          <input type="tel" class="form-control" id="phone" required placeholder="例如：0912345678" oninput="checkPhoneLength(this)" onblur="checkCustomerByPhone()">
          <div id="welcome-msg" style="color: var(--primary-dark); font-size: 14px; font-weight: bold; margin-top: 8px; display: none;"></div>
        </div>

        <div class="mb-4">
          <label class="form-label">姓名</label>
          <input type="text" class="form-control" id="name" required placeholder="請輸入您的姓名">
        </div>

        <div class="mb-4">
          <label class="form-label">身份</label>
          <div class="d-flex gap-2">
            <div class="type-btn" onclick="setType('old', this)">舊朋友</div>
            <div class="type-btn" onclick="setType('new', this)">新朋友</div>
          </div>
          <input type="hidden" id="custType" required>
          <div id="hint-text" class="hint-box"></div>
        </div>

        <div class="mb-4">
          <label class="form-label">預約項目 (可複選)</label>
          <div class="row g-2" id="service-grid"></div>
          <input type="hidden" id="service" required>
        </div>

        <div class="mb-4">
          <label class="form-label">日期</label>
          <div class="cal-wrapper">
            <div class="cal-header-row">
              <button type="button" class="cal-btn" onclick="changeMonth(-1)">❮</button>
              <div id="cal-month-year">讀取中...</div>
              <button type="button" class="cal-btn" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
          <input type="hidden" id="date" required>
        </div>

        <div class="mb-4">
          <label class="form-label">時段</label>
          <select id="time" class="form-select" required>
            <option value="">請先選擇項目與日期</option>
          </select>
          <div style="color: #888; font-size: 12px; margin-top: 8px;">理想時段如無法點選，可私訊 Rosa 詢問空檔唷❤️</div>
        </div>

        <button type="submit" class="btn-submit" id="subBtn">送出預約申請</button>
        <button type="button" class="btn-check" onclick="openCheckModal()">🔍 查詢我的預約紀錄</button>
      </form>

      <div class="d-flex gap-2 mt-3">
        <a id="top-btn-map" href="#" target="_blank" class="btn btn-light flex-fill border fw-bold shadow-sm" style="color: var(--text-dark); padding: 12px; border-radius: 12px;">📍 店面導航</a>
        <a href="https://www.google.com/maps/search/停車場" target="_blank" class="btn btn-light flex-fill border fw-bold shadow-sm" style="color: var(--text-dark); padding: 12px; border-radius: 12px;">🅿️ 附近停車</a>
      </div>
    </div>

    <div class="care-section">
      <div class="care-header" onclick="toggleCare()"><span>居家保養小叮嚀</span><span>▼</span></div>
      <div class="care-content" id="care-content"></div>
    </div>

    <div class="portfolio-title">PORTFOLIO</div>
    <div class="tab-wrap">
      <div class="tab active" onclick="filterWork('女生染髮', this)">女生染髮</div>
      <div class="tab" onclick="filterWork('女生燙髮', this)">女生燙髮</div>
      <div class="tab" onclick="filterWork('男生剪燙', this)">男生剪燙</div>
    </div>
    <div class="row g-3" id="portfolio-grid"></div>

    <div class="footer">Designed by <a href="https://heysibyl.com" target="_blank">Sibyl | 數位管家</a></div>
  </div>
</div>

<div id="success-screen">
  <div class="success-icon">✔</div>
  <h2 style="color: var(--text-dark); font-weight: bold;">預約申請已送出！</h2>
  <p style="color:#666; margin-bottom: 30px; line-height: 1.6;">請留意 LINE 訊息，<br>Rosa 確認後會回覆您喔❤️</p>
  <button class="btn-submit" style="width: auto; padding: 12px 40px; border-radius: 30px;" onclick="location.reload()">返回首頁</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 填入你部署的獨立 GAS Web App URL
  const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";

  let db = { availableDates: [], services: [], portfolio: [] };
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();

  window.onload = async function() {
    try {
      const res = await fetch(`${API_URL}?action=getInitialData`);
      db = await res.json();

      document.getElementById('promo').innerText = db.promoText || "歡迎光臨 Rosa Hair！";
      document.getElementById('nav-ig').href = db.ig || '#';
      document.getElementById('nav-line').href = db.line || '#';
      document.getElementById('nav-map').href = db.map || '#';
      if(document.getElementById('top-btn-map')) document.getElementById('top-btn-map').href = db.map || '#';
      document.getElementById('care-content').innerText = db.careText || "暫無資訊";

      const svcGrid = document.getElementById('service-grid');
      svcGrid.innerHTML = '';
      (db.services || []).forEach(s => {
        let col = document.createElement('div');
        col.className = 'col-6';
        col.innerHTML = `<label class="chk-label"><input type="checkbox" value="${s.name}" onchange="updateServiceSelection(this)"> ${s.name}</label>`;
        svcGrid.appendChild(col);
      });

      renderFrontCalendar();
      filterWork('女生染髮');
    } catch (e) {
      console.error(e);
      document.getElementById('promo').innerText = "系統連線中...";
    }
  };

  function checkPhoneLength(el) {
    if(el.value.trim().length >= 10) {
      checkCustomerByPhone();
    }
  }

  async function checkCustomerByPhone() {
    let phone = document.getElementById('phone').value.trim();
    if(phone.length >= 8) {
      document.getElementById('welcome-msg').style.display = 'block';
      document.getElementById('welcome-msg').innerText = '🔍 尋找紀錄中...';

      try {
        const res = await fetch(`${API_URL}?action=getCustomerName&phone=${phone}`);
        const data = await res.json();
        if(data.found) {
          document.getElementById('name').value = data.name;
          document.getElementById('welcome-msg').innerHTML = `✨ 歡迎回來，<b>${data.name}</b>！`;
          setType('old', document.querySelectorAll('.type-btn')[0]);
        } else {
          document.getElementById('welcome-msg').style.display = 'none';
          setType('new', document.querySelectorAll('.type-btn')[1]);
        }
      } catch (err) {
        document.getElementById('welcome-msg').style.display = 'none';
      }
    }
  }

  function setType(t, e) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    if(e) e.classList.add('active');
    document.getElementById('custType').value = t;
    const h = document.getElementById('hint-text');
    h.style.display = 'block';
    h.innerText = t === 'old' ? "🤝 舊客禮：介紹新朋友消費，贈送護髮膜一份！" : "✨ 新客禮：經舊客介紹預約，燙染享 85 折優惠！";
  }

  function toggleCare() {
    const c = document.getElementById('care-content');
    c.style.display = c.style.display === 'block' ? 'none' : 'block';
  }

  function updateServiceSelection(cb) {
    if (cb) {
      if (cb.checked) cb.parentElement.classList.add('selected');
      else cb.parentElement.classList.remove('selected');
    }
    let checkedBoxes = Array.from(document.querySelectorAll('#service-grid input:checked'));
    let selectedValues = checkedBoxes.map(el => el.value);
    document.getElementById('service').value = selectedValues.join(', ');
    updateTimes();
  }

  function renderFrontCalendar() {
    const grid = document.getElementById('cal-grid');
    const title = document.getElementById('cal-month-year');
    title.innerText = `${currentYear} 年 ${currentMonth + 1} 月`;
    let html = `<div class="cal-cell header">日</div><div class="cal-cell header">一</div><div class="cal-cell header">二</div><div class="cal-cell header">三</div><div class="cal-cell header">四</div><div class="cal-cell header">五</div><div class="cal-cell header">六</div>`;

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for(let i = 0; i < firstDay; i++) { html += `<div class="cal-cell empty"></div>`; }

    const selectedDate = document.getElementById('date').value;
    for(let i = 1; i <= daysInMonth; i++) {
      let dStr = `${currentYear}/${String(currentMonth + 1).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
      let isAvailable = (db.availableDates || []).includes(dStr);
      let isActive = (dStr === selectedDate);
      if (isAvailable) html += `<div class="cal-cell available ${isActive ? 'active' : ''}" onclick="selectDate('${dStr}')">${i}</div>`;
      else html += `<div class="cal-cell disabled">${i}</div>`;
    }
    grid.innerHTML = html;
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if(currentMonth > 11) { currentMonth = 0; currentYear++; }
    if(currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderFrontCalendar();
  }

  function selectDate(dStr) {
    document.getElementById('date').value = dStr;
    renderFrontCalendar();
    updateTimes();
  }

  async function updateTimes() {
    const sStr = document.getElementById('service').value;
    const d = document.getElementById('date').value;
    const tSel = document.getElementById('time');

    if(!sStr || !d) {
      tSel.innerHTML = '<option value="">請先選擇項目與日期</option>';
      return;
    }
    tSel.innerHTML = '<option>計算排程中...</option>';

    try {
      const res = await fetch(`${API_URL}?action=getAvailableTimes&date=${encodeURIComponent(d)}&services=${encodeURIComponent(sStr)}`);
      const times = await res.json();
      tSel.innerHTML = '';
      if(times.length === 0) {
        tSel.add(new Option('所選項目加總時間，該日已無足夠空檔', ''));
      } else {
        times.forEach(t => tSel.add(new Option(t, t)));
      }
    } catch (e) {
      tSel.innerHTML = '<option value="">載入失敗</option>';
    }
  }

  function filterWork(cat, el) {
    if (el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    const filtered = (db.portfolio || []).filter(w => w.cat === cat);
    if(filtered.length === 0) {
      grid.innerHTML = '<div class="col-12"><p style="text-align:center;font-size:13px;color:#999;margin-top:20px;">尚無作品</p></div>';
      return;
    }
    filtered.forEach(w => {
      grid.innerHTML += `<div class="col-6"><div class="work-item" onclick="window.open('${w.link}', '_blank')"><div class="work-img" style="background-image:url('${w.img}')"></div><div class="work-info">${w.title}</div></div></div>`;
    });
  }

  function openCheckModal() {
    Swal.fire({
      title: '🔍 查詢預約紀錄',
      input: 'tel',
      inputLabel: '請輸入您預約時填寫的手機號碼',
      inputPlaceholder: '例如：0912345678',
      showCancelButton: true,
      confirmButtonText: '查詢',
      cancelButtonText: '返回',
      confirmButtonColor: 'var(--text-dark)',
      preConfirm: (phone) => {
        if (!phone) { Swal.showValidationMessage('請輸入手機號碼'); return false; }
        return phone;
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: '查詢中...', allowOutsideClick: false });
        Swal.showLoading();

        try {
          const res = await fetch(`${API_URL}?action=checkBooking&phone=${result.value}`);
          const data = await res.json();

          if (data.error) {
            Swal.fire('查詢失敗', data.error, 'error');
          } else if (!data.records || data.records.length === 0) {
            Swal.fire('查無紀錄', '您目前沒有未來的預約紀錄唷！', 'info');
          } else {
            let html = '<div style="text-align:left;">';
            data.records.forEach(r => {
              let statusColor = r.status === '待確認' ? '#f57c00' : '#4caf50';
              html += `
                <div style="background:#f9f9f9; border:1px solid #eee; border-radius:12px; padding:15px; margin-bottom:10px; position:relative;">
                   <div style="font-weight:bold; font-size:18px; color:var(--text-dark); margin-bottom:5px;">${r.date} ${r.time}</div>
                   <div style="font-size:14px; color:#555; margin-bottom:5px;">項目：${r.service}</div>
                   <div style="position:absolute; right:15px; top:15px; font-weight:bold; font-size:13px; color:${statusColor};">${r.status}</div>
                </div>`;
            });
            html += '<p style="font-size:13px; color:#888; margin-top:15px; line-height:1.5;">※ 如需更改時間或取消，<br>請點擊左下角 LINE 私訊 Rosa 為您處理唷！❤️</p></div>';
            Swal.fire({
              title: '您的預約紀錄',
              html: html,
              confirmButtonText: '好的',
              confirmButtonColor: 'var(--text-dark)'
            });
          }
        } catch (e) {
          Swal.fire('連線異常', '無法取得資料，請稍後再試', 'error');
        }
      }
    });
  }

  document.getElementById('bookForm').onsubmit = async function(e) {
    e.preventDefault();
    if (!document.getElementById('service').value) { alert("請至少選擇一項預約項目！"); return; }
    if (!document.getElementById('date').value) { alert("請先在月曆上點選預約日期！"); return; }

    const btn = document.getElementById('subBtn');
    btn.disabled = true;
    btn.innerText = "正在傳送申請...";

    const payload = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      type: document.getElementById('custType').value,
      service: document.getElementById('service').value,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitBooking",
          data: payload
        })
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        document.getElementById('booking-ui').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
        window.scrollTo(0, 0);
      } else {
        alert("預約傳送發生問題：" + (data.error || "請重試"));
        btn.disabled = false;
        btn.innerText = "送出預約申請";
      }
    } catch (err) {
      alert("連線發生錯誤，請稍候重試");
      btn.disabled = false;
      btn.innerText = "送出預約申請";
    }
  };
</script>
